<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL - Cricket Premier League</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        nav {
            height: 70px;
            background: #0c1b2e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #1b3048;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #31d7a3;
        }

        nav a {
            color: #aebdce;
            text-decoration: none;
            margin-left: 30px;
            cursor: pointer;
        }

        nav a:hover {
            color: white;
        }

        .page {
            padding: 45px 7%;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 40px;
        }

        .budget {
            background: #0c1b2e;
            border: 1px solid #1b3048;
            padding: 18px 25px;
            border-radius: 12px;
            text-align: right;
        }

        .budget-title {
            color: #8ea1b5;
            font-size: 13px;
        }

        .budget-value {
            color: #31d7a3;
            font-size: 25px;
            font-weight: bold;
            margin-top: 5px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter {
            background: #0c1b2e;
            color: #aebdce;
            border: 1px solid #1b3048;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter:hover {
            border-color: #31d7a3;
        }

        .filter.active {
            background: #31d7a3;
            color: #07111f;
            font-weight: bold;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .player {
            background: #0c1b2e;
            border: 1px solid #1b3048;
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
        }

        .player:hover {
            transform: translateY(-3px);
            border-color: #31d7a3;
        }

        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-icon {
            font-size: 38px;
        }

        .position {
            color: #31d7a3;
            font-size: 12px;
            font-weight: bold;
        }

        .player-name {
            font-size: 19px;
            font-weight: bold;
            margin-top: 15px;
        }

        .country {
            color: #8ea1b5;
            margin-top: 5px;
        }

        .player-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .price {
            font-weight: bold;
            color: white;
        }

        .add {
            background: #31d7a3;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add:hover {
            background: #55e5b7;
        }

        .add.remove {
            background: #c92f45;
            color: white;
        }

        .team-section {
            margin-top: 55px;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .team-count {
            color: #8ea1b5;
        }

        .selected {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .selected-card {
            background: #10243a;
            border: 1px solid #31d7a3;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .selected-card div:first-child {
            font-size: 32px;
        }

        .empty {
            color: #61758a;
            padding: 30px;
            border: 1px dashed #1b3048;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .players {
                grid-template-columns: repeat(2, 1fr);
            }

            .selected {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .top {
                align-items: flex-start;
                gap: 20px;
                flex-direction: column;
            }

            .players {
                grid-template-columns: 1fr;
            }

            .selected {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🏏 <span>CPL</span></div>

        <div>
            <a onclick="showHome()">Home</a>

    </nav>

    <main class="page">

        </div>

        <div class="filters">
            <button class="filter active" onclick="filterPlayers('ALL', this)">ALL</button>
            <button class="filter" onclick="filterPlayers('WK', this)">WK</button>
            <button class="filter" onclick="filterPlayers('BAT', this)">BAT</button>
            <button class="filter" onclick="filterPlayers('AR', this)">ALL-ROUNDERS</button>
            <button class="filter" onclick="filterPlayers('BOWL', this)">BOWLERS</button>
        </div>

        <div class="players" id="players"></div>

        <section class="team-section">

            <div class="team-header">
                <h2>My Team</h2>
                <div class="team-count" id="teamCount">0 / 11 players</div>
            </div>

            <div class="selected" id="selected">

                <div class="empty">
                    Your team is empty.<br>
                    Pick some players above!
                </div>

            </div>

        </section>

    </main>

        let selectedPlayers = [];
        let remainingBudget = 100;

        function displayPlayers(list = players) {

            const container = document.getElementById("players");

            container.innerHTML = "";

            list.forEach((player, index) => {

                const isSelected = selectedPlayers.includes(index);

                const card = document.createElement("div");

                card.className = "player";

                card.innerHTML = `
                    <div class="player-top">
                        <div class="player-icon">${player.icon}</div>
                        <div class="position">${player.position}</div>
                    </div>

                    <div class="player-name">${player.name}</div>

                    <div class="country">${player.country}</div>

                    <div class="player-bottom">
                        <div class="price">£${player.price}m</div>

                        <button
                            class="add ${isSelected ? "remove" : ""}"
                            onclick="togglePlayer(${index})"
                        >
                            ${isSelected ? "REMOVE" : "ADD"}
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function togglePlayer(index) {

            const player = players[index];

            if (selectedPlayers.includes(index)) {

                selectedPlayers = selectedPlayers.filter(
                    playerIndex => playerIndex !== index
                );

                remainingBudget += player.price;

            } else {

                if (selectedPlayers.length >= 11) {
                    alert("You can only have 11 players.");
                    return;
                }

                if (remainingBudget < player.price) {
                    alert("You don't have enough money!");
                    return;
                }

                selectedPlayers.push(index);

                remainingBudget -= player.price;
            }

            updateTeam();
            displayPlayers();
        }

        function updateTeam() {

            document.getElementById("budget").textContent =
                "£" + remainingBudget.toFixed(1) + "m";

            document.getElementById("teamCount").textContent =
                selectedPlayers.length + " / 11 players";

            const selectedContainer =
                document.getElementById("selected");

            if (selectedPlayers.length === 0) {

                selectedContainer.innerHTML = `
                    <div class="empty">
                        Your team is empty.<br>
                        Pick some players above!
                    </div>
                `;

                return;
            }

            selectedContainer.innerHTML = "";

            selectedPlayers.forEach(index => {

                const player = players[index];

                const card = document.createElement("div");

                card.className = "selected-card";

                card.innerHTML = `
                    <div>${player.icon}</div>
                    <strong>${player.name}</strong>
                    <p style="color:#31d7a3; margin-top:6px;">
                        ${player.position}
                    </p>
                `;

                selectedContainer.appendChild(card);
            });
        }

        function filterPlayers(position, button) {

            document.querySelectorAll(".filter").forEach(
                filter => filter.classList.remove("active")
            );

            button.classList.add("active");

            if (position === "ALL") {
                displayPlayers(players);
            } else {
                displayPlayers(
                    players.filter(player => player.position === position)
                );
            }
        }

        function showHome() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function showTeam() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        displayPlayers();

    </script>
